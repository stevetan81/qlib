# HATS Rolling Retrain 配置（Restart）— CSI500 动态成分池 + DoubleEnsemble + Alpha158
# 用于 Phase 2 滚动训练实验（market=csi500_dyn）

qlib_init:
    provider_uri: "/home/tanlu/myworkspace/HATS/data/qlib_export/cn/qlib_bin"
    region: cn

market: &market csi500_dyn
benchmark: &benchmark SH000905

data_handler_config: &data_handler_config
    start_time: 2015-01-01
    end_time: 2026-01-30
    fit_start_time: 2015-01-01
    fit_end_time: 2022-12-31
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2025-01-01
        end_time: 2026-01-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        kwargs:
            base_model: gbm
            loss: mse
            num_models: 6
            enable_sr: true
            enable_fs: true
            alpha1: 1
            alpha2: 1
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            epochs: 28
            # LightGBM params (same as baseline)
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2015-01-01, 2022-12-31]
                valid: [2023-01-01, 2024-12-31]
                test: [2025-01-01, 2026-01-30]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: false
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config

