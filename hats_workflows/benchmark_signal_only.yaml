# HATS CSI1000 Benchmark 测试配置（仅信号分析，无回测）
# 用于评估模型性能（IC、ICIR、Rank IC、Rank ICIR）

qlib_init:
    provider_uri: "/home/tanlu/myworkspace/HATS/data/qlib_export/cn"
    region: cn

market: &market csi1000
benchmark: &benchmark SH000852

data_handler_config: &data_handler_config
    start_time: 2010-01-01
    end_time: 2026-01-26
    fit_start_time: 2010-01-01
    fit_end_time: 2021-12-31
    instruments: *market

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.0421
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
            early_stopping_rounds: 50
            num_boost_round: 1000

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2010-01-01, 2019-12-31]
                valid: [2020-01-01, 2021-12-31]
                test: [2022-01-01, 2026-01-26]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
