# HATS Qlib 预测配置
# 用于全市场股票的每日预测

qlib_init:
    provider_uri: "/home/tanlu/myworkspace/HATS/data/qlib_export/cn/qlib_bin"
    region: cn

# 预测范围：全市场
market: &market all

# 数据处理配置 (与训练保持一致)
data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-12-31
    fit_start_time: 2020-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    # 兼容部分 Qlib 版本: 需要提供 label 字段定义
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

# 数据集配置
dataset_config: &dataset_config
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
        handler:
            class: Alpha158
            module_path: qlib.contrib.data.handler
            kwargs: *data_handler_config
        segments:
            predict: [2026-01-01, 2026-12-31]

# 模型路径（部署到 HATS 目录）
model_path: "/home/tanlu/myworkspace/HATS/models/qlib_deployed_current.pkl"

# 输出配置
output:
    path: "/home/tanlu/myworkspace/HATS/data/predictions"
    format: csv
    filename_pattern: "pred_{date}.csv"

# 预测字段
prediction_fields:
    - datetime      # 预测日期
    - instrument    # 股票代码
    - score         # 预测分数
    - rank          # 排名
