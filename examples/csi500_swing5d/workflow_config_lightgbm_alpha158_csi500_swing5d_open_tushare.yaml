qlib_init:
    # 建议把 tushare 自建数据放到独立目录，避免与官方 cn_data 混用
    provider_uri: "~/.qlib/qlib_data/cn_data_tushare"
    region: cn

market: &market csi500
benchmark: &benchmark SH000905

data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2025-12-31
    fit_start_time: 2012-01-01
    fit_end_time: 2019-12-31
    # instruments 支持 dict + filter_pipe：动态过滤 ST / 停牌日（需要你在数据里提供对应字段）
    instruments:
        market: *market
        filter_pipe:
            - filter_type: ExpressionDFilter
              rule_expression: "$is_st == 0"
              filter_start_time: null
              filter_end_time: null
              keep: false
            - filter_type: ExpressionDFilter
              rule_expression: "$volume > 0"
              filter_start_time: null
              filter_end_time: null
              keep: false
    label: ["Ref($open, -6) / Ref($open, -1) - 1"]
    infer_processors:
        - class: ProcessInf
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 6
            only_tradable: true
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2022-01-01
        end_time: 2025-12-31
        account: 200000
        benchmark: *benchmark
        exchange_kwargs:
            # 逐股逐日限价：要求你在 quote 数据中提供 up_limit/down_limit 字段（可由 tushare.stk_limit 获取）
            # True 表示“受限不可交易”；此处按开盘价判断，偏保守
            limit_threshold:
                - "$open >= $up_limit"
                - "$open <= $down_limit"
            deal_price: open
            trade_unit: 100
            open_cost: 0.0003
            close_cost: 0.0008
            min_cost: 5
            impact_cost: 0.0002

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            num_leaves: 255
            max_depth: -1
            subsample: 0.8
            colsample_bytree: 0.8
            reg_alpha: 0.0
            reg_lambda: 10.0
            n_estimators: 2000
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2019-12-31]
                valid: [2020-01-01, 2021-12-31]
                test: [2022-01-01, 2025-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

