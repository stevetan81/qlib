qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn

market: &market csi500
benchmark: &benchmark SH000905

data_handler_config: &data_handler_config
    start_time: 2012-01-01
    end_time: 2025-12-31
    fit_start_time: 2012-01-01
    fit_end_time: 2019-12-31
    instruments: *market
    # 目标：T 日收盘后出信号，T+1 开盘交易；平均持有期≈5天
    label: ["Ref($open, -6) / Ref($open, -1) - 1"]
    infer_processors:
        - class: ProcessInf
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 6
            only_tradable: true
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2022-01-01
        end_time: 2025-12-31
        account: 200000
        benchmark: *benchmark
        exchange_kwargs:
            # 统一阈值近似 10% 涨跌停（更精确版本见 *_tushare.yaml）
            limit_threshold: 0.095
            deal_price: open
            trade_unit: 100
            # 交易成本请按你的券商费率调整；短线对成本极敏感，建议先取保守值
            open_cost: 0.0003
            close_cost: 0.0008
            min_cost: 5
            impact_cost: 0.0002

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            num_leaves: 255
            max_depth: -1
            subsample: 0.8
            colsample_bytree: 0.8
            reg_alpha: 0.0
            reg_lambda: 10.0
            n_estimators: 2000
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2012-01-01, 2019-12-31]
                valid: [2020-01-01, 2021-12-31]
                test: [2022-01-01, 2025-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

